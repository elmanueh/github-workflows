name: release

on:
  workflow_dispatch:

concurrency:
  group: release-actions-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: elmanueh/release-actions@v1
        with:
          operation: create-release
