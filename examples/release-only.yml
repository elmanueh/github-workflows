# Copy to .github/workflows/release.yml for Git tag and GitHub release only.
name: release

on:
  workflow_dispatch:

concurrency:
  group: release-actions-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create tag and GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        uses: elmanueh/release-actions@v1
        with:
          operation: create-release
