# Copy this file to .github/workflows/release.yml in your application repository.
# Adapt these Docker paths and run the workflow from main.
name: release

on:
  workflow_dispatch:

jobs:
  release:
    uses: elmanueh/github-workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      packages: write
    with:
      context: .
      dockerfile: docker/Dockerfile
