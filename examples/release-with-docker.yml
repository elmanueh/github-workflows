# Copy to .github/workflows/release.yml for GitHub release and Docker image.
name: release with docker

on:
  workflow_dispatch:

concurrency:
  group: release-actions-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Create tag and GitHub release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create release
        uses: elmanueh/release-actions@v1
        with:
          operation: create-release

  build:
    name: Build image (${{ matrix.runner }})
    needs: release
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build image
        uses: elmanueh/release-actions@v1
        with:
          operation: build-image
          context: .
          dockerfile: Dockerfile

  publish:
    name: Publish Docker image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Publish image for both architectures
        uses: elmanueh/release-actions@v1
        with:
          operation: publish-image
