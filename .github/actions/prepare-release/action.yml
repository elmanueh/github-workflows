name: prepare-release
description: Publish the semantic release, define the build matrix and generate image metadata.
inputs:
  token:
    description: GitHub token with the permissions required by the calling job.
    required: true
  matrix:
    description: JSON array of architecture and native runner pairs.
    required: true
outputs:
  tag:
    description: Immutable release tag.
    value: ${{ steps.release.outputs.tag }}
  labels:
    description: OCI image labels.
    value: ${{ steps.metadata.outputs.labels }}
  matrix:
    description: Validated build matrix.
    value: ${{ steps.matrix.outputs.matrix }}
  architectures:
    description: JSON array of expected architectures.
    value: ${{ steps.matrix.outputs.architectures }}
  published:
    description: Whether a release was published.
    value: ${{ steps.release.outputs.published }}
  image-name:
    description: Normalized GHCR image repository.
    value: ${{ steps.image.outputs.name }}
  version:
    description: Published semantic version.
    value: ${{ steps.release.outputs.version }}
runs:
  using: composite
  steps:
    - name: Validate the build matrix
      id: matrix
      env:
        BUILD_MATRIX: ${{ inputs.matrix }}
      run: |
        jq -e '
          type == "array" and length > 0
          and all(.[];
            (.arch | type == "string" and test("^[a-z0-9]+$"))
            and (.runner | type == "string" and length > 0))
          and ([.[].arch] | length == (unique | length))
        ' <<< "$BUILD_MATRIX" >/dev/null
        echo "matrix=$(jq -c '{include: .}' <<< "$BUILD_MATRIX")" >> "$GITHUB_OUTPUT"
        echo "architectures=$(jq -c '[.[].arch]' <<< "$BUILD_MATRIX")" >> "$GITHUB_OUTPUT"
      shell: bash
    - name: Resolve image repository
      id: image
      shell: bash
      run: |
        image="ghcr.io/$GITHUB_REPOSITORY"
        image="${image,,}"
        if [[ ! "$image" =~ ^ghcr\.io/[a-z0-9._-]+/[a-z0-9._/-]+$ ]]; then
          echo "Expected a GHCR image repository, got: $image" >&2
          exit 1
        fi
        echo "name=$image" >> "$GITHUB_OUTPUT"
    - name: Set up release runtime
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - name: Install centralized release tools
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
      run: |
        pipeline_root="$(cd "$ACTION_DIRECTORY/../../.." && pwd)"
        npm ci --prefix "$pipeline_root" --ignore-scripts --no-audit --no-fund
    - name: Analyze commits and publish release
      id: release
      shell: bash
      env:
        ACTION_DIRECTORY: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        pipeline_root="$(cd "$ACTION_DIRECTORY/../../.." && pwd)"
        node "$pipeline_root/src/release/release.mjs"
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
      if: ${{ steps.release.outputs.published == 'true' }}
    - name: Reject an existing immutable image
      env:
        RELEASE_TAG: ${{ steps.release.outputs.tag }}
        IMAGE_NAME: ${{ steps.image.outputs.name }}
      run: |
        if docker manifest inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>&1; then
          echo "${IMAGE_NAME}:${RELEASE_TAG} already exists; it will not be overwritten." >&2
          exit 1
        fi
      shell: bash
      if: ${{ steps.release.outputs.published == 'true' }}
    - name: Generate Docker metadata
      id: metadata
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.name }}
        tags: type=raw,value=${{ steps.release.outputs.tag }}
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.version=${{ steps.release.outputs.version }}
      if: ${{ steps.release.outputs.published == 'true' }}
