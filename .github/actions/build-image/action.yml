name: build-image
description: Build on a native runner, push by digest and upload the digest for publication.
inputs:
  image-name:
    description: Container image repository.
    required: true
  token:
    description: GitHub token with the permissions required by the calling job.
    required: true
  architecture:
    description: Linux architecture built by this native runner.
    required: true
  labels:
    description: OCI image labels.
    required: false
  context:
    description: Docker build context.
    required: false
    default: .
  dockerfile:
    description: Dockerfile path relative to repository root.
    required: false
    default: Dockerfile
outputs:
  digest:
    description: Published architecture image digest.
    value: ${{ steps.image.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Build and push image by digest
      id: image
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        platforms: linux/${{ inputs.architecture }}
        labels: ${{ inputs.labels }}
        outputs: type=image,name=${{ inputs.image-name }},push-by-digest=true,name-canonical=true,push=true
        cache-from: |
          type=gha,scope=docker-release-${{ inputs.architecture }}
          type=gha,scope=docker-ci
        cache-to: type=gha,scope=docker-release-${{ inputs.architecture }},mode=max
        file: ${{ inputs.dockerfile }}
    - name: Save image digest
      env:
        IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        IMAGE_ARCH: ${{ inputs.architecture }}
      run: |
        if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "Invalid image digest: $IMAGE_DIGEST" >&2
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/digests"
        printf '%s\n' "$IMAGE_DIGEST" > "$RUNNER_TEMP/digests/${IMAGE_ARCH}.txt"
      shell: bash
    - name: Upload image digest
      uses: actions/upload-artifact@v7
      with:
        name: image-digest-${{ inputs.architecture }}
        path: ${{ runner.temp }}/digests/${{ inputs.architecture }}.txt
        if-no-files-found: error
        retention-days: 1
        overwrite: true
