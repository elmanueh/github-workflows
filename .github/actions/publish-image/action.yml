name: publish-image
description: Merge architecture digests into an immutable release tag and verify the published image.
inputs:
  image-name:
    description: Container image repository.
    required: true
  token:
    description: GitHub token with the permissions required by the calling job.
    required: true
  tag:
    description: Immutable release tag.
    required: true
  architectures:
    description: JSON array of expected architectures from the build matrix.
    required: true
outputs:
  digest:
    description: Verified multi-platform image digest.
    value: ${{ steps.verify.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Download image digests
      uses: actions/download-artifact@v8
      with:
        pattern: image-digest-*
        path: ${{ runner.temp }}/digests
        merge-multiple: true
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Publish the release manifest
      run: |
        if docker manifest inspect "${IMAGE_NAME}:${RELEASE_TAG}" >/dev/null 2>&1; then
          echo "${IMAGE_NAME}:${RELEASE_TAG} already exists; it will not be overwritten." >&2
          exit 1
        fi
        sources=()
        mapfile -t architectures < <(jq -r '.[]' <<< "$ARCHITECTURES")
        for arch in "${architectures[@]}"; do
          digest="$(cat "$RUNNER_TEMP/digests/${arch}.txt")"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid $arch image digest: $digest" >&2
            exit 1
          fi
          sources+=("${IMAGE_NAME}@${digest}")
        done
        docker buildx imagetools create \
          --tag "${IMAGE_NAME}:${RELEASE_TAG}" \
          --metadata-file "$RUNNER_TEMP/image-metadata.json" \
          "${sources[@]}"
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        RELEASE_TAG: ${{ inputs.tag }}
        ARCHITECTURES: ${{ inputs.architectures }}
      shell: bash
    - name: Verify the published image digest
      run: |
        expected_digest="$(jq -er '."containerimage.descriptor".digest' "$RUNNER_TEMP/image-metadata.json")"
        published_digest="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
        if [[ "$published_digest" != "$expected_digest" ]]; then
          echo "Published digest mismatch: expected $expected_digest, got $published_digest" >&2
          exit 1
        fi
        docker buildx imagetools inspect "${IMAGE_NAME}@${published_digest}" --raw > "$RUNNER_TEMP/image-manifest.json"
        jq -e --argjson expected "$ARCHITECTURES" '
          [.manifests[] | select(.platform.os == "linux") | .platform.architecture]
          | sort == ($expected | sort)
        ' "$RUNNER_TEMP/image-manifest.json"
        {
          echo "### Published image"
          echo '```text'
          echo "${IMAGE_NAME}:${RELEASE_TAG}@${published_digest}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        echo "digest=$published_digest" >> "$GITHUB_OUTPUT"
      env:
        IMAGE_NAME: ${{ inputs.image-name }}
        RELEASE_TAG: ${{ inputs.tag }}
        ARCHITECTURES: ${{ inputs.architectures }}
      id: verify
      shell: bash
