name: Standard release
on:
  workflow_call:
    inputs:
      context:
        description: Docker build context.
        type: string
        default: .
      dockerfile:
        description: Dockerfile path.
        type: string
        default: Dockerfile
    outputs:
      version:
        description: 'Pipeline output: version'
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: 'Pipeline output: tag'
        value: ${{ jobs.release.outputs.tag }}
      image-name:
        description: 'Pipeline output: image-name'
        value: ${{ jobs.release.outputs.image-name }}
      digest:
        description: 'Pipeline output: digest'
        value: ${{ jobs.publish.outputs.digest }}
      published:
        description: 'Pipeline output: published'
        value: ${{ jobs.release.outputs.published }}
concurrency:
  group: standard-release-${{ github.repository }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: Publish semantic release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      labels: ${{ steps.release.outputs.labels }}
      matrix: ${{ steps.release.outputs.matrix }}
      architectures: ${{ steps.release.outputs.architectures }}
      published: ${{ steps.release.outputs.published }}
      image-name: ${{ steps.release.outputs.image-name }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare release
        id: release
        uses: elmanueh/github-workflows/.github/actions/prepare-release@v1
        with:
          matrix: '[{"arch":"amd64","runner":"ubuntu-24.04"},{"arch":"arm64","runner":"ubuntu-24.04-arm"}]'
          token: ${{ secrets.GITHUB_TOKEN }}
  build:
    name: Build ${{ matrix.arch }} image
    needs: release
    if: ${{ needs.release.outputs.published == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build architecture image
        uses: elmanueh/github-workflows/.github/actions/build-image@v1
        with:
          image-name: ${{ needs.release.outputs.image-name }}
          architecture: ${{ matrix.arch }}
          labels: ${{ needs.release.outputs.labels }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          token: ${{ secrets.GITHUB_TOKEN }}
  publish:
    name: Publish multi-platform image
    needs:
      - release
      - build
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Publish and verify image
        id: publish
        uses: elmanueh/github-workflows/.github/actions/publish-image@v1
        with:
          image-name: ${{ needs.release.outputs.image-name }}
          tag: ${{ needs.release.outputs.tag }}
          architectures: ${{ needs.release.outputs.architectures }}
          token: ${{ secrets.GITHUB_TOKEN }}
