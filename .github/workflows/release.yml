name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-actions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  ci:
    name: Validate action
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish action
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source and release history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish exact action version
        id: release
        uses: ./
        with:
          operation: create-release

      - name: Update major version tag
        if: ${{ steps.release.outputs.tag != '' }}
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node src/release/update-major-tag.mjs
